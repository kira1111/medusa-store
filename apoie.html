<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoie - Medusa Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-black text-white d-flex flex-column min-vh-100">


    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="medusa.html">🐍 Medusa Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav w-100">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="Medusa - Site/jogos.html">sites</a>
                    <a class="nav-link" href="sobre.html">sobre</a>
                    <a class="nav-link active" aria-current="page" href="apoie.html">apoie</a>

                    <div id="user-area" class="ms-auto d-flex align-items-center">

                    </div>
                </div>
            </div>
        </div>
    </nav>


    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card bg-dark text-white border-secondary shadow-lg p-4 text-center">

                    <div class="mb-3 text-success fs-1">
                        <i class="bi bi-heart-fill"></i>
                    </div>

                    <h2 class="fw-bold mb-2">Apoie o Projeto</h2>
                    <p class="text-secondary small mb-4">
                        Sua doação nos ajuda a manter os servidores ativos e a continuar trazendo novos produtos e
                        conteúdos!
                    </p>


                    <form id="formApoio" onsubmit="realizarDoacao(event)">
                        <label class="form-label fw-bold d-block text-start">Escolha o valor da doação:</label>

                        <div class="btn-group w-100 mb-3" role="group" aria-label="Valores de doação">
                            <input type="radio" class="btn-check" name="valorDoacao" id="val5" value="5"
                                autocomplete="off" checked>
                            <label class="btn btn-outline-success" for="val5">R$ 5</label>

                            <input type="radio" class="btn-check" name="valorDoacao" id="val10" value="10"
                                autocomplete="off">
                            <label class="btn btn-outline-success" for="val10">R$ 10</label>

                            <input type="radio" class="btn-check" name="valorDoacao" id="val25" value="25"
                                autocomplete="off">
                            <label class="btn btn-outline-success" for="val25">R$ 25</label>

                            <input type="radio" class="btn-check" name="valorDoacao" id="val50" value="50"
                                autocomplete="off">
                            <label class="btn btn-outline-success" for="val50">R$ 50</label>
                        </div>


                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text bg-secondary text-white border-secondary">R$</span>
                                <input type="number" id="valorLivre"
                                    class="form-control bg-dark text-white border-secondary" placeholder="Outro valor"
                                    min="1" step="0.50">
                            </div>
                        </div>


                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow">
                            <i class="bi bi-qr-code-scan me-2"></i> Doar com PIX
                        </button>
                    </form>


                    <small class="text-secondary d-block mt-3">
                        <i class="bi bi-shield-check text-success me-1"></i> Transação 100% segura
                    </small>
                </div>
            </div>
        </div>
    </main>


    <footer class="bg-dark text-secondary text-center py-3 border-top border-secondary mt-auto">
        <div class="container">
            <p class="mb-1 small">🐍 <strong>Medusa Store</strong> &copy; 2026 - Todos os direitos reservados.</p>
            <div class="d-flex justify-content-center gap-3 small">
                <a href="medusa.html" class="text-secondary text-decoration-none">Início</a>
                <span>•</span>
                <a href="sobre.html" class="text-secondary text-decoration-none">Sobre Nós</a>
                <span>•</span>
                <a href="apoie.html" class="text-secondary text-decoration-none">Apoie</a>
            </div>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        function realizarDoacao(event) {
            event.preventDefault();

            const valorLivre = document.getElementById('valorLivre').value;
            let valorFinal = 0;

            if (valorLivre && parseFloat(valorLivre) > 0) {
                valorFinal = parseFloat(valorLivre);
            } else {
                const radioSelecionado = document.querySelector('input[name="valorDoacao"]:checked');
                valorFinal = parseFloat(radioSelecionado.value);
            }

            alert(`Obrigado pelo apoio! Chave Pix para doação de R$ ${valorFinal.toFixed(2)} gerada com sucesso.`);
        }
    </script>
</body>

</html>
